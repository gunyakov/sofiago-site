<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 — Page Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f8f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #22252a;
        }
        .error-page { width: 100%; max-width: 560px; padding: 24px; text-align: center; }
        .error-brand { display: inline-flex; align-items: center; gap: .5rem; margin-bottom: 32px; text-decoration: none; font-size: 1.5rem; font-weight: 700; color: #22252a; }
        .error-brand img { width: 28px; height: 28px; vertical-align: middle; }
        .error-brand .go { font-family: 'Caveat', cursive; color: #F84525; }
        .error-card { background: #fff; border-radius: 24px; padding: 56px 40px; box-shadow: 0 10px 40px rgba(0, 0, 0, .06); }
        .error-code { font-family: 'Caveat', cursive; font-size: 5.5rem; line-height: 1; font-weight: 600; color: #F84525; margin-bottom: 8px; }
        .error-card h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 12px; }
        .error-card p { font-size: 1rem; color: #6b7280; line-height: 1.6; margin: 0 0 28px; }
        .error-btn { display: inline-block; background: #F84525; color: #fff; text-decoration: none; font-weight: 600; padding: 12px 32px; border-radius: 50px; }
        .error-btn:hover { opacity: .9; }
    </style>
</head>
<body>
    <div class="error-page">
        <a href="/" class="error-brand"><img src="/assets/dashboard/dist/img/mini-logo.png" alt="">Sofia<span class="go">GO</span></a>
        <div class="error-card">
            <div class="error-code">404</div>
            <h1>Page Not Found</h1>
            <p>It looks like this page does not exist — it may have been removed or the address was mistyped.</p>
            <a href="/" class="error-btn">Back Home</a>
        </div>
    </div>
</body>
</html>
